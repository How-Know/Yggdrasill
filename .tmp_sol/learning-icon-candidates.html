<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>학습 아이콘 후보</title>
<style>
  body { margin: 0; background: #101114; color: #f4f5f5; font-family: Pretendard, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; font-weight: 700; margin: 28px 28px 6px; }
  p { margin: 0 28px 22px; color: #9aa0a0; font-size: 13px; }
  .row { display: flex; gap: 16px; padding: 0 28px 32px; }
  .card { width: 132px; }
  .name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .note { font-size: 12px; color: #9aa0a0; min-height: 48px; margin-bottom: 12px; }
  .states { display: flex; gap: 8px; }
  .slot { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #9aa0a0; }
  .pill { width: 62px; height: 39px; border-radius: 999px; display: grid; place-items: center; }
  .pill.on { background: rgba(56,56,56,0.72); }
  svg { width: 28px; height: 28px; }
  .off svg { stroke: #9aa0a0; stroke-width: 1.7; }
  .on svg { stroke: #ffffff; stroke-width: 2.15; }
</style>
</head>
<body>
  <h1>학습 아이콘 후보</h1>
  <p>지금은 뇌 모양입니다. 왼쪽은 평소, 오른쪽은 선택 상태입니다. Icons8이 아니라 Untitled UI 아이콘입니다.</p>
  <div class="row" id="row"></div>
  <script>
    const icons = [
      ["1. GraduationHat01", "학사모. 선이 적어 메뉴에 잘 맞습니다.",
        '<path d="M5 10v6.011c0 .36 0 .539.055.697a1 1 0 0 0 .23.374c.118.12.278.2.6.36l5.4 2.7c.262.131.393.197.53.223a1 1 0 0 0 .37 0c.137-.026.268-.091.53-.223l5.4-2.7c.322-.16.482-.24.6-.36a.999.999 0 0 0 .23-.374c.055-.158.055-.338.055-.697v-6.01M2 8.5l9.642-4.822c.131-.066.197-.098.266-.111a.5.5 0 0 1 .184 0c.069.013.135.045.266.11L22 8.5l-9.642 4.821a1.028 1.028 0 0 1-.266.111.501.501 0 0 1-.184 0c-.069-.012-.135-.045-.266-.11L2 8.5Z"/>'],
      ["2. GraduationHat02", "학사모에 술과 책 받침이 있습니다.",
        '<path d="M17 14.5v-3.005c0-.18 0-.27-.027-.349a.5.5 0 0 0-.116-.187c-.058-.06-.139-.1-.3-.18L12 8.5m-8 1v6.807c0 .372 0 .558.058.72a1 1 0 0 0 .244.381c.124.12.293.198.631.353l6.4 2.934c.246.112.368.168.496.19.113.02.229.02.342 0 .128-.022.25-.078.496-.19l6.4-2.934c.338-.155.507-.232.63-.353a1 1 0 0 0 .245-.38c.058-.163.058-.35.058-.721V9.5m-18-1 9.642-4.821c.131-.066.197-.098.266-.111a.5.5 0 0 1 .184 0c.069.013.135.045.266.11L22 8.5l-9.642 4.821a1.028 1.028 0 0 1-.266.111.501.501 0 0 1-.184 0c-.069-.012-.135-.045-.266-.11L2 8.5Z"/>'],
      ["3. Pencil01", "연필. 형태가 단순합니다.",
        '<path d="m2.5 21.5 5.55-2.134c.354-.137.532-.205.698-.294.147-.08.288-.171.42-.274.149-.115.283-.25.552-.518L21 7a2.828 2.828 0 1 0-4-4L5.72 14.28c-.269.268-.403.403-.519.552a2.997 2.997 0 0 0-.273.42c-.089.166-.157.344-.294.699L2.5 21.5Zm0 0 2.058-5.351c.147-.383.221-.575.347-.662a.5.5 0 0 1 .38-.08c.15.028.295.173.585.463l2.26 2.26c.29.29.435.434.464.585a.5.5 0 0 1-.08.38c-.089.126-.28.2-.663.347L2.5 21.5Z"/>'],
      ["4. Atom01", "원자. 과학 수업에 가깝습니다.",
        '<path d="M12 12h.01m3.525 3.536c-4.686 4.686-10.068 6.902-12.02 4.95-1.953-1.953.263-7.335 4.949-12.021 4.686-4.687 10.068-6.903 12.02-4.95 1.953 1.952-.263 7.334-4.949 12.02Zm0-7.072c4.686 4.687 6.902 10.069 4.95 12.021-1.953 1.953-7.335-.263-12.021-4.95-4.686-4.686-6.902-10.068-4.95-12.02 1.953-1.953 7.335.263 12.021 4.95ZM12.499 12a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0Z"/>'],
      ["5. Backpack", "책가방. 학원 가방처럼 보입니다.",
        '<path d="M20 13v4.8c0 1.12 0 1.68-.218 2.108a2 2 0 0 1-.874.874C18.48 21 17.92 21 16.8 21H7.2c-1.12 0-1.68 0-2.108-.218a2 2 0 0 1-.874-.874C4 19.48 4 18.92 4 17.8V13m5-3h6m-5.714 4h5.428c2.133 0 3.199 0 4.021-.396a4 4 0 0 0 1.869-1.868C21 10.912 21 9.845 21 7.713c0-1.6 0-2.399-.297-3.016a3 3 0 0 0-1.401-1.4C18.685 3 17.885 3 16.286 3H7.714c-1.6 0-2.399 0-3.016.297a3 3 0 0 0-1.4 1.401C3 5.315 3 6.115 3 7.714c0 2.133 0 3.199.396 4.021a4 4 0 0 0 1.868 1.869C6.087 14 7.154 14 9.286 14Z"/>'],
      ["6. Certificate01", "수료증. 줄과 리본이 있습니다.",
        '<path d="M6.5 20H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-1.5M12 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 0h.021L8.83 22.193 6 19.364l3.02-3.02M12 19l3.193 3.193 2.828-2.829-3.02-3.02M9 6h6M7 9.5h10"/>']
    ];
    const svg = (body, cls) => `<div class="pill ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${body}</svg></div>`;
    document.getElementById("row").innerHTML = icons.map(([name, note, body]) => `
      <div class="card">
        <div class="name">${name}</div>
        <div class="note">${note}</div>
        <div class="states">
          <div class="slot"><div class="label">평소</div>${svg(body, "off")}</div>
          <div class="slot"><div class="label">선택</div>${svg(body, "on")}</div>
        </div>
      </div>`).join("");
  </script>
</body>
</html>
