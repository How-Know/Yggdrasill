<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Icons8 설정 아이콘</title>
<style>
  body { margin: 0; background: #101114; color: #f4f5f5; font-family: Pretendard, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; font-weight: 700; margin: 28px 28px 6px; }
  p { margin: 0 28px 22px; color: #9aa0a0; font-size: 13px; }
  .row { display: flex; gap: 16px; padding: 0 28px 32px; flex-wrap: wrap; }
  .card { width: 140px; }
  .name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .note { font-size: 12px; color: #9aa0a0; min-height: 36px; margin-bottom: 12px; }
  .states { display: flex; gap: 8px; }
  .slot { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #9aa0a0; }
  .pill { width: 62px; height: 39px; border-radius: 999px; display: grid; place-items: center; }
  .pill.on { background: rgba(56,56,56,0.72); }
  img { width: 26px; height: 26px; }
  .off img { filter: grayscale(1) brightness(0.75); }
  .on img { filter: brightness(0) invert(1); }
</style>
</head>
<body>
  <h1>Icons8 설정 아이콘</h1>
  <p>iOS 선 스타일입니다. 왼쪽은 평소, 오른쪽은 선택 상태입니다.</p>
  <div class="row">
    <div class="card"><div class="name">1. Settings</div><div class="note">가장 단순한 톱니.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=364&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=364&format=png&size=128"></div></div></div></div>
    <div class="card"><div class="name">2. Gear</div><div class="note">이빨이 더 분명한 기어.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=53375&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=53375&format=png&size=128"></div></div></div></div>
    <div class="card"><div class="name">3. Services</div><div class="note">톱니 세 개. 조금 복잡합니다.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=11678&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=11678&format=png&size=128"></div></div></div></div>
    <div class="card"><div class="name">4. Automatic</div><div class="note">원 안에 작은 톱니.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=3473&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=3473&format=png&size=128"></div></div></div></div>
    <div class="card"><div class="name">5. Automation</div><div class="note">가로 슬라이더. 설정 화면 느낌입니다.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=12640&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=12640&format=png&size=128"></div></div></div></div>
    <div class="card"><div class="name">6. Gears</div><div class="note">맞물린 톱니 두 개.</div><div class="states"><div class="slot"><div class="label">평소</div><div class="pill off"><img src="https://img.icons8.com/?id=22990&format=png&size=128"></div></div><div class="slot"><div class="label">선택</div><div class="pill on"><img src="https://img.icons8.com/?id=22990&format=png&size=128"></div></div></div></div>
  </div>
</body>
</html>
