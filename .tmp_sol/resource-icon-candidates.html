<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>자료 아이콘 후보</title>
<style>
  body { margin: 0; background: #101114; color: #f4f5f5; font-family: Pretendard, "Segoe UI", sans-serif; }
  h1 { font-size: 18px; font-weight: 700; margin: 28px 28px 6px; }
  p { margin: 0 28px 22px; color: #9aa0a0; font-size: 13px; }
  .row { display: flex; gap: 16px; padding: 0 28px 32px; }
  .card { width: 132px; }
  .name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .note { font-size: 12px; color: #9aa0a0; min-height: 48px; margin-bottom: 12px; }
  .states { display: flex; gap: 8px; }
  .slot { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #9aa0a0; }
  .pill { width: 62px; height: 39px; border-radius: 999px; display: grid; place-items: center; }
  .pill.on { background: rgba(56,56,56,0.72); }
  svg { width: 28px; height: 28px; }
  .off svg { stroke: #9aa0a0; stroke-width: 1.7; }
  .on svg { stroke: #ffffff; stroke-width: 2.15; }
</style>
</head>
<body>
  <h1>자료 아이콘 후보</h1>
  <p>지금 자료 메뉴는 펼친 책입니다. 왼쪽은 평소, 오른쪽은 선택 상태입니다.</p>
  <div class="row" id="row"></div>
  <script>
    const icons = [
      ["1. BookOpen01", "펼친 책. 지금 아이콘과 가장 가깝습니다.",
        '<path d="m12 21-.1-.15c-.695-1.042-1.042-1.563-1.5-1.94a4 4 0 0 0-1.378-.737C8.453 18 7.827 18 6.575 18H5.2c-1.12 0-1.68 0-2.108-.218a2 2 0 0 1-.874-.874C2 16.48 2 15.92 2 14.8V6.2c0-1.12 0-1.68.218-2.108a2 2 0 0 1 .874-.874C3.52 3 4.08 3 5.2 3h.4c2.24 0 3.36 0 4.216.436a4 4 0 0 1 1.748 1.748C12 6.04 12 7.16 12 9.4M12 21V9.4M12 21l.1-.15c.695-1.042 1.042-1.563 1.5-1.94a3.999 3.999 0 0 1 1.378-.737C15.547 18 16.173 18 17.425 18H18.8c1.12 0 1.68 0 2.108-.218a2 2 0 0 0 .874-.874C22 16.48 22 15.92 22 14.8V6.2c0-1.12 0-1.68-.218-2.108a2 2 0 0 0-.874-.874C20.48 3 19.92 3 18.8 3h-.4c-2.24 0-3.36 0-4.216.436a4 4 0 0 0-1.748 1.748C12 6.04 12 7.16 12 9.4"/>'],
      ["2. BookOpen02", "펼친 책이지만 선이 더 적습니다.",
        '<path d="M12 20H5.2c-1.12 0-1.68 0-2.108-.218a2 2 0 0 1-.874-.874C2 18.48 2 17.92 2 16.8V7.2c0-1.12 0-1.68.218-2.108a2 2 0 0 1 .874-.874C3.52 4 4.08 4 5.2 4h.4c2.24 0 3.36 0 4.216.436a4 4 0 0 1 1.748 1.748C12 7.04 12 8.16 12 10.4m0 9.6v-9.6m0 9.6h6.8c1.12 0 1.68 0 2.108-.218a2 2 0 0 0 .874-.874C22 18.48 22 17.92 22 16.8V7.2c0-1.12 0-1.68-.218-2.108a2 2 0 0 0-.874-.874C20.48 4 19.92 4 18.8 4h-.4c-2.24 0-3.36 0-4.216.436a4 4 0 0 0-1.748 1.748C12 7.04 12 8.16 12 10.4"/>'],
      ["3. BookClosed", "닫힌 책. 책등만 보입니다.",
        '<path d="M20 19v-3H7a3 3 0 0 0-3 3m4.8 3h8c1.12 0 1.68 0 2.108-.218a2 2 0 0 0 .874-.874C20 20.48 20 19.92 20 18.8V5.2c0-1.12 0-1.68-.218-2.108a2 2 0 0 0-.874-.874C18.48 2 17.92 2 16.8 2h-8c-1.68 0-2.52 0-3.162.327a3 3 0 0 0-1.311 1.311C4 4.28 4 5.12 4 6.8v10.4c0 1.68 0 2.52.327 3.162a3 3 0 0 0 1.311 1.311C6.28 22 7.12 22 8.8 22Z"/>'],
      ["4. Folder", "열린 폴더. 자료를 모아 둔 느낌입니다.",
        '<path d="m13 7-1.116-2.231c-.32-.642-.481-.963-.72-1.198a2 2 0 0 0-.748-.462C10.1 3 9.74 3 9.022 3H5.2c-1.12 0-1.68 0-2.108.218a2 2 0 0 0-.874.874C2 4.52 2 5.08 2 6.2V7m0 0h15.2c1.68 0 2.52 0 3.162.327a3 3 0 0 1 1.311 1.311C22 9.28 22 10.12 22 11.8v4.4c0 1.68 0 2.52-.327 3.162a3 3 0 0 1-1.311 1.311C19.72 21 18.88 21 17.2 21H6.8c-1.68 0-2.52 0-3.162-.327a3 3 0 0 1-1.311-1.311C2 18.72 2 17.88 2 16.2V7Z"/>'],
      ["5. File01", "빈 문서. 형태가 가장 단순합니다.",
        '<path d="M4 6.8c0-1.68 0-2.52.327-3.162a3 3 0 0 1 1.311-1.311C6.28 2 7.12 2 8.8 2h6.4c1.68 0 2.52 0 3.162.327a3 3 0 0 1 1.311 1.311C20 4.28 20 5.12 20 6.8v10.4c0 1.68 0 2.52-.327 3.162a3 3 0 0 1-1.311 1.311C17.72 22 16.88 22 15.2 22H8.8c-1.68 0-2.52 0-3.162-.327a3 3 0 0 1-1.311-1.311C4 19.72 4 18.88 4 17.2V6.8Z"/>'],
      ["6. File02", "줄이 있는 문서. 교재 페이지에 가깝습니다.",
        '<path d="M14 11H8m2 4H8m8-8H8m12-.2v10.4c0 1.68 0 2.52-.327 3.162a3 3 0 0 1-1.311 1.311C17.72 22 16.88 22 15.2 22H8.8c-1.68 0-2.52 0-3.162-.327a3 3 0 0 1-1.311-1.311C4 19.72 4 18.88 4 17.2V6.8c0-1.68 0-2.52.327-3.162a3 3 0 0 1 1.311-1.311C6.28 2 7.12 2 8.8 2h6.4c1.68 0 2.52 0 3.162.327a3 3 0 0 1 1.311 1.311C20 4.28 20 5.12 20 6.8Z"/>']
    ];
    const svg = (body, cls) => `<div class="pill ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${body}</svg></div>`;
    document.getElementById("row").innerHTML = icons.map(([name, note, body]) => `
      <div class="card">
        <div class="name">${name}</div>
        <div class="note">${note}</div>
        <div class="states">
          <div class="slot"><div class="label">평소</div>${svg(body, "off")}</div>
          <div class="slot"><div class="label">선택</div>${svg(body, "on")}</div>
        </div>
      </div>`).join("");
  </script>
</body>
</html>
