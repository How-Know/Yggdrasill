<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지 · 정현수학교습소</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #fff;
      color: #1d1d1f;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10vh 24px 48px;
    }
    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    h1 {
      margin: 18px 0 0;
      font-size: clamp(32px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
    }
    .lead {
      margin: 8px 0 0;
      color: #6e6e73;
      font-size: 17px;
      letter-spacing: -0.016em;
      line-height: 1.4;
      text-align: center;
    }
    .list {
      width: min(420px, 100%);
      margin-top: 36px;
    }
    .item {
      padding: 22px 0;
      border-top: 1px solid #f3f3f6;
      text-align: left;
    }
    .item:last-child { border-bottom: 1px solid #f3f3f6; }
    .date {
      margin: 0;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: #6e6e73;
    }
    .title {
      margin: 6px 0 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }
    .note {
      margin: 8px 0 0;
      color: #6e6e73;
      font-size: 17px;
      letter-spacing: -0.016em;
      line-height: 1.45;
    }
    .item.past .title { color: #6e6e73; }
    .group {
      margin: 28px 0 0;
      color: #86868b;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .empty, .error {
      margin: 36px 0 0;
      color: #6e6e73;
      font-size: 17px;
      letter-spacing: -0.016em;
      text-align: center;
    }
    footer {
      margin-top: auto;
      padding-top: 64px;
      color: #86868b;
      font-size: 12px;
      letter-spacing: -0.01em;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="/chrome.css">
</head>
<body>
  <header class="phonebar">
    <a class="phonebar-name" href="/">정현수학교습소</a>
    <div class="phonebar-tools">
      <button class="iconbtn" type="button" id="open-search" aria-label="검색">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M15.8 15.8 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="iconbtn" type="button" id="open-menu" aria-label="메뉴" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="panel" id="menu-panel" hidden>
    <div class="panel-top">
      <button class="iconbtn" type="button" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <a href="/notices">공지</a>
    <a href="/location">위치</a>
    <a href="/consult">신규 상담</a>
  </div>
  <div class="panel" id="search-panel" hidden>
    <div class="panel-top">
      <button class="iconbtn" type="button" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <input class="panel-search" id="site-search" type="search" placeholder="검색" autocomplete="off" enterkeyhint="search">
    <div id="search-list"></div>
    <p class="panel-empty" id="search-empty" hidden>없는 메뉴입니다.</p>
  </div>
  <main class="with-fab">
    <a href="/"><img class="logo" src="logo.png" alt="정현수학교습소"></a>
    <h1>공지</h1>
    <p class="lead">휴강 안내</p>
    <div class="list" id="list" hidden></div>
    <p class="empty" id="empty" hidden>올라온 공지가 없습니다.</p>
    <p class="error" id="error" hidden>공지를 불러오지 못했습니다.</p>
    <footer>Copyright © 2026 정현수학교습소</footer>
  </main>
  <script>
    const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

    function escapeText(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    function heading(audience) {
      const name = String(audience || '').trim() || '전체';
      return name.endsWith('휴강') ? name : name + ' 휴강';
    }

    function dateLabel(iso) {
      const parts = String(iso).split('-');
      if (parts.length !== 3) return iso;
      const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      if (Number.isNaN(date.getTime())) return iso;
      return date.getFullYear() + '년 ' + (date.getMonth() + 1) + '월 ' + date.getDate() + '일 ' + weekdays[date.getDay()] + '요일';
    }

    const list = document.querySelector('#list');
    const empty = document.querySelector('#empty');
    const error = document.querySelector('#error');

    fetch('/api/notices')
      .then((response) => response.json().then((body) => ({ ok: response.ok, body })))
      .then(({ ok, body }) => {
        const notices = Array.isArray(body.notices) ? body.notices : [];
        if (!ok) {
          error.hidden = false;
          return;
        }
        if (!notices.length) {
          empty.hidden = false;
          return;
        }
        const upcoming = notices.filter((notice) => notice.upcoming !== false);
        const past = notices.filter((notice) => notice.upcoming === false).reverse();
        const item = (notice, pastItem) => {
          const note = String(notice.note || '').trim();
          return '<article class="item' + (pastItem ? ' past' : '') + '">'
            + '<p class="date">' + escapeText(dateLabel(notice.date)) + '</p>'
            + '<h2 class="title">' + escapeText(heading(notice.audience)) + '</h2>'
            + (note ? '<p class="note">' + escapeText(note) + '</p>' : '')
            + '</article>';
        };
        list.innerHTML = upcoming.map((notice) => item(notice, false)).join('')
          + (past.length ? '<p class="group">지난 공지</p>' : '')
          + past.map((notice) => item(notice, true)).join('');
        list.hidden = false;
      })
      .catch(() => {
        error.hidden = false;
      });
  </script>
  <a class="fab" href="/consult" aria-label="신규 상담">
    <span class="fab-pill" aria-hidden="true">
      <img class="fab-mark" src="/fab-chat.svg" alt="" width="20" height="20">
      <span>신규 상담</span>
    </span>
    <span class="fab-dot" aria-hidden="true">
      <img class="fab-mark" src="/fab-chat.svg" alt="" width="20" height="20">
    </span>
  </a>
  <script src="/chrome.js"></script>
</body>
</html>
